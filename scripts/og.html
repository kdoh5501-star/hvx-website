<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HIVE-X OG image</title>
<!-- Rendered to public/og.png (1200x630) by scripts/make-og.mjs. Uses the same card styles as the site. -->
<link rel="stylesheet" href="../node_modules/@fontsource-variable/plus-jakarta-sans/wght.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="../src/styles/main.css">
<style>
  :root{color-scheme:light}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f6f6f4}
  .og{width:1200px;height:630px;display:grid;grid-template-columns:600px 600px;align-items:center;position:relative;overflow:hidden}
  .og .copy{padding:0 0 0 80px;display:grid;gap:22px}
  .og .brand{font-size:1.6rem;gap:14px}
  .og h1{font-size:4.1rem;line-height:1.04;margin:0}
  .og h1 span{color:var(--red)}
  .og .lead{font-size:1.25rem;max-width:36ch}
  .og .stage{min-height:630px}
  .og .card3d{width:300px}
  .og .bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#d6202f,#8e0f1a)}
</style>
</head>
<body>
<div class="og">
  <div class="copy">
    <span class="brand"><img src="../assets/hvx-logo-96.png" width="44" height="44" alt="">HIVE-X</span>
    <div class="kicker">Cross-border payments · HVX</div>
    <h1>Your money, <span>without borders.</span></h1>
    <p class="lead">Card, wallet and the HVX token on BNB Smart Chain.</p>
  </div>
  <div class="stage">
    <div class="halo"></div><div class="ring"></div>
    <div class="card3d" id="card" role="img" aria-label="HIVE-X Card">
        <div class="top"><span class="tier">business</span></div>
        <div class="chiprow"><div class="chip"></div><svg class="contactless" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7c2 3 2 7 0 10M12 5c3 4 3 10 0 14M16 3c4 5 4 13 0 18"/></svg></div>
        <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3.6"/><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"><polygon points="50.0,15.8 59.7,21.4 59.7,32.6 50.0,38.2 40.3,32.6 40.3,21.4"/><polygon points="38.7,35.3 48.4,40.9 48.4,52.1 38.7,57.7 29.0,52.1 29.0,40.9"/><polygon points="61.3,35.3 71.0,40.9 71.0,52.1 61.3,57.7 51.6,52.1 51.6,40.9"/></g><text x="50" y="79" text-anchor="middle" fill="currentColor" font-family="Plus Jakarta Sans Variable, Plus Jakarta Sans, sans-serif" font-size="17" font-weight="800" letter-spacing="1">HVX</text></svg>
        <div class="bottom"><span class="pan">•••• 2026</span><span class="wordmark">HIVE-X</span></div>
      </div>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
